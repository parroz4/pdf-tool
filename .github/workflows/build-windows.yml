name: Build Windows apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build portable app
        run: pyinstaller packaging/pdf_tool_win.spec --noconfirm

      - name: Smoke test (open test PDF offscreen)
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          Start-Process -FilePath "dist/PDFTool/PDFTool.exe" -ArgumentList "examples/test.pdf" -PassThru | Tee-Object -Variable proc
          Start-Sleep -Seconds 8
          if ($proc.HasExited -and $proc.ExitCode -ne 0) { exit 1 }
          Stop-Process -Id $proc.Id -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: PDFTool-windows-portable
          path: dist/PDFTool/

      # Sui tag v*: pubblica una Release con lo zip allegato (download
      # permanente, senza login, sempre l'ultima versione in evidenza)
      - name: Zip portable folder
        if: startsWith(github.ref, 'refs/tags/')
        run: Compress-Archive -Path dist/PDFTool -DestinationPath PDFTool-windows-portable.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PDFTool-windows-portable.zip
          generate_release_notes: true

  # App desktop della versione web (Electron): installer NSIS.
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Tool-Setup
          path: web/release/PDF-Tool-Setup-*.exe
          if-no-files-found: error

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: web/release/PDF-Tool-Setup-*.exe
          generate_release_notes: true
